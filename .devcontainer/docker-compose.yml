version: '3.8'

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=1000
        - USER_GID=1000
    
    volumes:
      # Mount the project directory
      - ..:/workspace:cached
      
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Cache volumes for better performance
      - composer-cache:/home/vscode/.composer
      - npm-cache:/home/vscode/.npm
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      
      # Bash history
      - bash-history:/commandhistory
    
    # Keep container running
    command: /bin/sh -c "while sleep 1000; do :; done"
    
    # Network mode for accessing host services
    network_mode: service:postgres
    
    # Capabilities for Docker-in-Docker
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    
    depends_on:
      - postgres
      - redis
      - mailpit
      - minio
    
    environment:
      # Database
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: coolify
      DB_USERNAME: coolify
      DB_PASSWORD: password
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      
      # Mail
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      
      # MinIO
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: local
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: true
      
      # Application
      APP_ENV: local
      APP_DEBUG: true
      
      # WebSocket
      PUSHER_HOST: localhost
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_APP_ID: coolify
      PUSHER_APP_KEY: coolify
      PUSHER_APP_SECRET: coolify
      
      # Vite
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: coolify
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coolify
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO client to create default bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb local/local --ignore-existing;
      mc anonymous set download local/local;
      echo 'MinIO initialization complete';
      "

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
  minio-data:
  composer-cache:
  npm-cache:
  vscode-extensions:
  bash-history:
